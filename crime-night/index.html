<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESN Crime Night</title>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0d0d;color:#141414;font-family:'Special Elite',monospace}
    .folder{background:#f3e7b3;padding:32px 28px;max-width:320px;margin:16px;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.7);text-align:center}
    h1{margin:0 0 8px;letter-spacing:.05em}
    .stamp{display:inline-block;margin-top:16px;border:3px double #b3261e;color:#b3261e;padding:4px 10px;transform:rotate(-8deg)}
  </style>
</head>
<body>
  <div class="folder">
    <h1>ESN CRIME NIGHT</h1>
    <p>Case file opening soon…</p>
    <div class="stamp">TOP SECRET</div>
  </div>
</body>
</html>
